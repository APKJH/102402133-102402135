<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园寻物招领小程序</title><style>
*{box-sizing:border-box}body{margin:0;background:#dfe5f1;color:#20283b;font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}.phone{width:390px;max-width:100%;min-height:100vh;margin:auto;background:#f5f7fb;box-shadow:0 0 30px #aab4cc}.status{height:28px;padding:5px 18px;background:#fff;font-weight:bold;display:flex;justify-content:space-between}.app{min-height:calc(100vh - 28px);padding-bottom:70px}.page{display:none}.page.active{display:block}.hero{padding:24px 20px;background:linear-gradient(135deg,#eef3ff,#fff)}h1,h2,h3,p{margin-top:0}.hero h1{font-size:25px;margin-bottom:6px}.muted{color:#7d879c}.search{display:flex;gap:8px;margin-top:18px;background:#fff;border-radius:12px;padding:8px;box-shadow:0 5px 15px #dfe4f0}.search input{min-width:0;flex:1;border:0;outline:0;padding:5px}.btn{background:#3f5cf4;color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer}.quick,.cards{display:grid;gap:12px;padding:16px 18px}.quick{grid-template-columns:1fr 1fr}.quick button,.card,.form,.detail{background:#fff;border:1px solid #e9edf4;border-radius:14px;padding:15px}.quick button{text-align:left;cursor:pointer}.quick b{display:block;font-size:16px;margin:5px 0}.section{padding:0 18px}.section-title{display:flex;justify-content:space-between;margin:8px 0 12px}.card{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;cursor:pointer}.emoji{width:45px;height:45px;border-radius:12px;background:#fff0d7;display:grid;place-items:center;font-size:24px}.card h3{font-size:15px;margin:0}.card small{color:#7d879c}.tag{display:inline-block;color:#3f5cf4;background:#eef2ff;border-radius:20px;padding:2px 8px;font-size:11px;margin-top:4px}.tag.found{color:#159674;background:#eaf8f2}.bar{height:55px;background:#fff;border-bottom:1px solid #e8ecf3;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0}.bar button{background:transparent;font-size:24px;cursor:pointer}.bar h2{font-size:18px;margin:0}.form{margin:16px 18px}.form label{display:block;font-weight:bold;margin:14px 0 6px}.form input,.form textarea,.form select{width:100%;border:1px solid #e5e9f1;border-radius:10px;padding:11px;outline:0}.form textarea{height:90px;resize:none}.seg{display:flex;background:#eef1f7;border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;color:#7d879c;cursor:pointer}.seg button.on{background:#fff;color:#3f5cf4;font-weight:bold}.full{width:100%;margin-top:18px}.detail{margin:0;border-radius:0;border:0;min-height:520px}.detail-photo{height:190px;background:linear-gradient(135deg,#e3eaff,#fff0d5);display:grid;place-items:center;font-size:76px;margin:-15px -15px 20px}.facts{border-top:1px solid #edf0f5;border-bottom:1px solid #edf0f5;padding:15px 0;margin:18px 0;display:grid;grid-template-columns:55px 1fr;gap:9px}.facts dt{color:#7d879c}.facts dd{margin:0}.nav{position:fixed;bottom:0;width:390px;max-width:100%;height:70px;background:#fff;border-top:1px solid #e8ecf3;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{border:0;background:transparent;color:#8a94a8;cursor:pointer}.nav button.on{color:#3f5cf4;font-weight:bold}.empty{text-align:center;color:#7d879c;padding:40px}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#20283b;color:#fff;border-radius:9px;display:none}.toast.show{display:block}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>▴ ▪ 100%</span></div><div class="app">
<section id="home" class="page active"><div class="hero"><h1>把遗失的物品找回来</h1><p class="muted">校园里的寻物与招领信息，一处集中查看。</p><div class="search"><input id="homeQ" placeholder="搜索物品、地点或关键词"><button class="btn" onclick="fromHome()">搜索</button></div></div><div class="quick"><button onclick="show('publish');mode('寻物')"><span>🔎</span><b>我要找物品</b><small class="muted">发布寻物信息</small></button><button onclick="show('publish');mode('招领')"><span>🤝</span><b>我捡到物品</b><small class="muted">发布招领信息</small></button></div><div class="section"><div class="section-title"><h3>最新信息</h3><span class="muted">刚刚更新</span></div><div id="homeCards" class="cards"></div></div></section>
<section id="search" class="page"><div class="bar"><button onclick="show('home')">‹</button><h2>搜索物品</h2><span class="muted">精准查找</span></div><div class="form"><div class="search" style="margin:0"><input id="q" placeholder="物品名称 / 地点 / 类别"><button class="btn" onclick="runSearch()">搜索</button></div><div class="seg" style="margin-top:14px"><button id="all" class="on" onclick="filter('全部')">全部</button><button id="lost" onclick="filter('寻物')">寻物</button><button id="found" onclick="filter('招领')">招领</button></div><div id="searchCards" class="cards" style="padding:16px 0"></div></div></section>
<section id="publish" class="page"><div class="bar"><button onclick="show('home')">‹</button><h2>发布信息</h2><span class="muted">填写线索</span></div><div class="form"><p class="muted">请填写物品特征、时间和地点，信息越完整越容易找回。</p><div class="seg"><button id="lostMode" class="on" onclick="mode('寻物')">寻物</button><button id="foundMode" onclick="mode('招领')">招领</button></div><label>物品名称</label><input id="title" placeholder="例如：蓝色校园卡套"><label>物品类别</label><select id="cat"><option>校园卡</option><option>钥匙</option><option>电子设备</option><option>书籍</option><option>其他</option></select><label>发现/遗失地点</label><input id="place" placeholder="例如：图书馆二楼自习区"><label>发生时间</label><input id="time" type="datetime-local" value="2026-09-28T15:30"><label>详细描述</label><textarea id="desc" placeholder="填写颜色、特征等关键信息"></textarea><label>物品图片（可选）</label><div class="empty" style="border:1px dashed #b7c3e3;padding:20px">＋ 添加图片（原型占位）</div><button class="btn full" onclick="publish()">发布信息</button></div></section>
<section id="detail" class="page"><div class="bar"><button onclick="show('search')">‹</button><h2>信息详情</h2><span class="muted">核对信息</span></div><div class="detail"><div id="photo" class="detail-photo">🎒</div><span id="dtag" class="tag">寻物</span><h1 id="dtitle">黑色双肩包</h1><p id="dsub" class="muted">发布于 2026-09-28 13:50</p><dl class="facts"><dt>类别</dt><dd id="dcat">生活用品</dd><dt>地点</dt><dd id="dplace">南区食堂门口</dd><dt>时间</dt><dd id="dtime">2026-09-28 13:50</dd><dt>描述</dt><dd id="ddesc">黑色双肩包，侧袋有白色贴纸，内有一本《构建之法》。</dd></dl><button class="btn full" onclick="toast('已展示联系方式')">联系发布者</button></div></section>
<section id="mine" class="page"><div class="bar"><h2>我的发布</h2><span class="muted">谭段昊</span></div><div id="mineCards" class="cards"></div></section>
</div><nav class="nav"><button id="n-home" class="on" onclick="show('home')">⌂<br>首页</button><button id="n-search" onclick="show('search')">⌕<br>搜索</button><button onclick="show('publish')">＋<br>发布</button><button id="n-mine" onclick="show('mine')">▣<br>我的</button></nav><div id="toast" class="toast"></div></main><script>
const data=[{t:'黑色双肩包',type:'寻物',cat:'生活用品',place:'南区食堂门口',time:'2026-09-28 13:50',desc:'黑色双肩包，侧袋有白色贴纸，内有一本《构建之法》。',e:'🎒'},{t:'校园卡一张',type:'招领',cat:'校园卡',place:'图书馆二楼自习区',time:'2026-09-28 12:30',desc:'在靠窗座位发现一张校园卡，已妥善保管。',e:'💳'},{t:'白色无线耳机',type:'寻物',cat:'电子设备',place:'体育馆西门',time:'2026-09-27 18:20',desc:'白色充电盒，盒面有一条浅蓝色划痕。',e:'🎧'},{t:'《高等数学》教材',type:'招领',cat:'书籍',place:'教学楼 A302',time:'2026-09-27 16:10',desc:'书内夹有一张课程表，请失主核对。',e:'📘'}];let current='全部',mtype='寻物',mine=[data[0],data[2]];
function card(x,i){return '<button class="card" onclick="detail('+i+')"><span class="emoji">'+x.e+'</span><span><h3>'+x.t+'</h3><small>'+x.place+' · '+x.time.slice(5,16)+'</small><br><span class="tag '+(x.type==='招领'?'found':'')+'">'+x.type+'</span></span><b>›</b></button>'}function render(){document.getElementById('homeCards').innerHTML=data.slice(0,3).map(card).join('');document.getElementById('searchCards').innerHTML=data.map(card).join('');document.getElementById('mineCards').innerHTML=mine.map(card).join('')}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));if(id==='home')document.getElementById('n-home').classList.add('on');if(id==='search')document.getElementById('n-search').classList.add('on');if(id==='mine')document.getElementById('n-mine').classList.add('on');window.scrollTo(0,0)}function mode(x){mtype=x;document.getElementById('lostMode').classList.toggle('on',x==='寻物');document.getElementById('foundMode').classList.toggle('on',x==='招领');show('publish')}function filter(x){current=x;document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('on'));document.getElementById(x==='全部'?'all':x==='寻物'?'lost':'found').classList.add('on');runSearch()}function fromHome(){document.getElementById('q').value=document.getElementById('homeQ').value;show('search');runSearch()}function runSearch(){let q=document.getElementById('q').value.toLowerCase();let a=data.filter(x=>(current==='全部'||x.type===current)&&(!q||(x.t+x.place+x.cat+x.desc).toLowerCase().includes(q)));document.getElementById('searchCards').innerHTML=a.length?a.map(card).join(''):'<div class="empty">没有找到匹配信息</div>'}function detail(i){let x=data[i]||data[0];document.getElementById('photo').textContent=x.e;document.getElementById('dtag').textContent=x.type;document.getElementById('dtag').className='tag '+(x.type==='招领'?'found':'');document.getElementById('dtitle').textContent=x.t;document.getElementById('dsub').textContent='发布于 '+x.time;document.getElementById('dcat').textContent=x.cat;document.getElementById('dplace').textContent=x.place;document.getElementById('dtime').textContent=x.time;document.getElementById('ddesc').textContent=x.desc;show('detail')}function publish(){let x={t:document.getElementById('title').value||'未命名物品',type:mtype,cat:document.getElementById('cat').value,place:document.getElementById('place').value||'未填写地点',time:'2026-09-28 15:30',desc:document.getElementById('desc').value||'暂无详细描述',e:'📦'};data.unshift(x);mine.unshift(x);render();show('mine');toast('发布成功，已进入我的发布')}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}render();</script></body></html>
